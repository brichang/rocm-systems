name: hipFile
run-name: Kicks off several hipFile CI workflows for various platforms

on:
  pull_request:
    types: [opened, synchronize, reopened] # Defaults
    paths:
      - 'projects/hipfile/**'
      - '.github/workflows/hipfile-*.yml'
      - '!**/*.md'
      - '!**/*.rst'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  Precheck:
    runs-on: [ubuntu-24.04]
    outputs:
      changed_dockerfile: ${{ steps.ci-flags.outputs.changed_dockerfile }}
      ci_matrix: ${{ steps.matrices.outputs.ci_matrix }}
      build_CI_images_matrix: ${{ steps.matrices.outputs.build_CI_images_matrix }}
      ci_images: ${{ steps.ci-images.outputs.ci_images }}
      nightly_build: ${{ steps.nightly.outputs.nightly_build }}
      nightly_rocm_version: ${{ steps.nightly.outputs.nightly_rocm_version }}
    env:
      # Matrix variables go here in JSON notation.
      # '>-' strips newlines
      SUPPORTED_PLATFORMS: >-
        [
          "rocky",
          "rocky8",
          "suse",
          "ubuntu"
        ]
      ROCM_VERSIONS: >-
        [
          "7.2.2"
        ]
      # MATRIX_INCLUDE / MATRIX_EXCLUDE: extra/removed matrix entries,
      # passed through to GHA's strategy.matrix include/exclude keys
      # so non-rectangular combinations (e.g. ubuntu x 7.13.0 only) can
      # be expressed without abandoning the base cross-product.
      MATRIX_INCLUDE: >-
        [
          {"supported_platforms": "ubuntu", "rocm_versions": "7.13.0"},
          {"supported_platforms": "ubuntu", "rocm_versions": "nightly"}
        ]
      MATRIX_EXCLUDE: >-
        []
    steps:
      - name: Fetching code repository...
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: rocm-systems
          sparse-checkout: |
            projects/hipfile
            .github/workflows
      - name: Git fetch base ref
        working-directory: rocm-systems
        run: git fetch origin "${GITHUB_BASE_REF}"
      - name: Set CI Flags
        working-directory: rocm-systems/projects/hipfile
        id: ci-flags
        run: |
          echo "changed_dockerfile=$(./util/files-changed.sh "origin/${GITHUB_BASE_REF}" HEAD 'projects/hipfile/util/docker/DOCKERFILE.*')" >> "${GITHUB_OUTPUT}"
      - name: Compute matrix configurations
        id: matrices
        env:
          CHANGED_DOCKERFILE: ${{ steps.ci-flags.outputs.changed_dockerfile }}
        # ci_matrix is the full strategy.matrix object handed to the test
        # job (Linux). GHA expands the cross-product and applies the
        # include/exclude keys itself.
        #
        # full_CI_images_matrix is the catalog of every CI image this run
        # references (for naming + pulling). It is derived by simulating GHA's
        # matrix expansion on ci_matrix, projecting each resulting combo down to
        # (supported_platforms, rocm_versions), and deduping. This way, future
        # test-only axes on ci_matrix (CXX, compiler, ...) do not multiply
        # images, and an exclude that removes all test legs for a given
        # (platform, version) correctly removes that image from the catalog.
        #
        # build_CI_images_matrix is the subset we actually (re)build this run
        # (see below). Both are emitted in include-only form so GHA spawns
        # exactly one image-build job per row.
        run: |
          ci_matrix=$(
            jq -c --null-input \
              --argjson supported_platforms "${SUPPORTED_PLATFORMS}" \
              --argjson rocm_versions "${ROCM_VERSIONS}" \
              --argjson matrix_include "${MATRIX_INCLUDE}" \
              --argjson matrix_exclude "${MATRIX_EXCLUDE}" \
              '{
                supported_platforms: $supported_platforms,
                rocm_versions: $rocm_versions,
                include: $matrix_include,
                exclude: $matrix_exclude
              }'
          )
          echo "hipFile CI Matrix: "
          echo "${ci_matrix}" | jq .
          echo "ci_matrix=${ci_matrix}" >> ${GITHUB_OUTPUT}

          full_CI_images_matrix=$(
            printf '%s' "${ci_matrix}" | jq -c '
              . as $ci
              | ($ci
                  | with_entries(select(.key != "include" and .key != "exclude"))
                ) as $base
              | ($ci.include // []) as $includes
              | ($ci.exclude // []) as $excludes

              # Cross-product of all base axes (auto-extends when axes added)
              | (reduce ($base | to_entries)[] as $axis (
                  [{}];
                  [ .[] as $combo
                  | $axis.value[] as $v
                  | $combo + { ($axis.key): $v }
                  ]
                )) as $cross

              # Apply excludes (partial match: every pinned field must match)
              | ($cross | map(. as $c | select(
                  [ $excludes[] | . as $e
                  | ($e | to_entries | all($c[.key] == .value))
                  ] | any | not
                ))) as $after_exclude

              # Includes that cannot merge into any original combo create
              # new combos. An include merges if none of its base-axis
              # values would overwrite the combos value; non-base-axis
              # fields are always mergeable.
              | ($includes | map(select(. as $incl
                  | [ $after_exclude[] | . as $c
                    | ($incl | to_entries | all(
                        ((.key as $k | $base | has($k)) | not)
                        or ($c[.key] == .value)
                      ))
                    ] | any | not
                ))) as $new_combos

              # Project to image-identity axes, drop empty rows, dedupe
              | ($after_exclude + $new_combos
                  | map({supported_platforms, rocm_versions}
                        | with_entries(select(.value != null)))
                  | map(select(length > 0))
                  | unique
                ) as $image_pairs

              | { include: $image_pairs }
            '
          )
          echo "hipFile Full CI Images Matrix: "
          echo "${full_CI_images_matrix}" | jq .
          echo "full_CI_images_matrix=${full_CI_images_matrix}" >> ${GITHUB_OUTPUT}

          # build_CI_images_matrix drives which images are actually (re)built this
          # run. When a Dockerfile changed we rebuild everything; otherwise only
          # the nightly rows, whose target moves daily and so cannot be served
          # from a pre-existing latest tag. (Other versions reuse their
          # latest-rocm<ver> image.)
          if [ "${CHANGED_DOCKERFILE}" = "1" ]; then
            build_CI_images_matrix="${full_CI_images_matrix}"
          else
            build_CI_images_matrix=$(
              printf '%s' "${full_CI_images_matrix}" \
                | jq -c '{include: [.include[] | select(.rocm_versions == "nightly")]}'
            )
          fi
          echo "hipFile Build CI Images Matrix: "
          echo "${build_CI_images_matrix}" | jq .
          echo "build_CI_images_matrix=${build_CI_images_matrix}" >> ${GITHUB_OUTPUT}
      - name: Resolve ROCm nightly metadata
        id: nightly
        working-directory: rocm-systems/projects/hipfile
        env:
          FULL_CI_IMAGES_MATRIX: ${{ steps.matrices.outputs.full_CI_images_matrix }}
        # Only resolves when a nightly row is present; otherwise emit empty values
        # so the downstream image-name step stays wired up unconditionally.
        run: |
          if printf '%s' "${FULL_CI_IMAGES_MATRIX}" \
              | jq -e '.include[]? | select(.rocm_versions == "nightly")' >/dev/null; then
            ./util/resolve-rocm-nightly.sh | tee -a "${GITHUB_OUTPUT}"
          else
            echo "nightly_build=" >> "${GITHUB_OUTPUT}"
            echo "nightly_rocm_version=" >> "${GITHUB_OUTPUT}"
          fi
      - name: Compute CI image names
        id: ci-images
        env:
          REGISTRY_URL: ghcr.io/${{ github.repository_owner }}
          CHANGED_DOCKERFILE: ${{ steps.ci-flags.outputs.changed_dockerfile }}
          FULL_CI_IMAGES_MATRIX: ${{ steps.matrices.outputs.full_CI_images_matrix }}
          NIGHTLY_BUILD: ${{ steps.nightly.outputs.nightly_build }}
        run: |
          if [ "${CHANGED_DOCKERFILE}" = "1" ]; then
            # sanitize ref for tag
            tag="$(echo "${GITHUB_REF}" | sed 's|[^a-zA-Z0-9]|-|g')-rocm"
          else
            tag="latest-rocm"
          fi
          # Consume full_CI_images_matrix.include directly: it is already
          # the deduplicated set of (platform, version) pairs we name images
          # for, derived from the full GHA-style expansion of ci_matrix.
          # Single source of truth -- no parallel exclude/include logic
          # here. Partial-axis include rows produce malformed image URLs
          # (e.g. "...:latest-rocm" with no version); the resulting docker
          # pull failure surfaces the malformed include to the maintainer.
          #
          # Nightly: the version axis is the literal "nightly". The image tag
          # carries the resolved YYYYMMDD-XXX build id for diagnosability
          # (e.g. :latest-rocm-nightly-20260602-26796279962), while the cache
          # ref stays floating (:latest-rocm-nightly-cache) so successive
          # nightly builds share cache layers.
          ci_images=$(
            jq -c -n \
              --arg registry "${REGISTRY_URL}" \
              --arg tag "$tag" \
              --arg nightly_build "${NIGHTLY_BUILD}" \
              --argjson build_matrix "${FULL_CI_IMAGES_MATRIX}" \
              '
                $build_matrix.include
                | map({ platform: .supported_platforms,
                        version:  .rocm_versions })
                | reduce .[] as $combo (
                    {}; . + {
                      ($combo.platform + "-" + $combo.version): (
                        ( $combo
                          # Versions concatenate after the "rocm" prefix without
                          # a separator ("latest-rocm7.2.2"). For nightly, insert
                          # a hyphen so the tag reads "latest-rocm-nightly[-BUILD]"
                          # rather than "latest-rocmnightly".
                          | .version_for_tag = (if .version == "nightly" then "-nightly" else .version end)
                          | .build_suffix    = (if .version == "nightly" and ($nightly_build | length) > 0
                                                then "-" + $nightly_build
                                                else "" end)
                          | .image_name    = ($registry + "/hipfile/ais_ci_" + .platform)
                          | .image         = (.image_name + ":" + $tag + .version_for_tag + .build_suffix)
                          | .cache         = (.image_name + ":latest-rocm" + .version_for_tag + "-cache")
                          | .image_nvidia  = (.image_name + ":" + $tag + .version_for_tag + .build_suffix + "-nvidia")
                          | .cache_nvidia  = (.image_name + ":latest-rocm" + .version_for_tag + "-nvidia-cache")
                        ) | {
                          ci_image:              (.image        | ascii_downcase),
                          ci_image_cache:        (.cache        | ascii_downcase),
                          ci_image_nvidia:       (.image_nvidia | ascii_downcase),
                          ci_image_nvidia_cache: (.cache_nvidia | ascii_downcase)
                        }
                      )
                    }
                  )
              '
          )
          echo "List of CI Images: "
          echo "${ci_images}" | jq .
          echo "ci_images=${ci_images}" >> "${GITHUB_OUTPUT}"

  build_CI_image:
    # build_CI_images_matrix is non-empty when a Dockerfile changed or a nightly
    # row exists; otherwise it has no include rows and this job produces no jobs.
    if: ${{ fromJSON(needs.Precheck.outputs.build_CI_images_matrix).include[0] != null }}
    needs: Precheck
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Precheck.outputs.build_CI_images_matrix) }}
    uses: ./.github/workflows/hipfile-image-build.yml
    with:
      ci_image_name: ${{ fromJSON(needs.Precheck.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image }}
      ci_image_cache: ${{ fromJSON(needs.Precheck.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image_cache }}
      ci_image_name_nvidia: ${{ fromJSON(needs.Precheck.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image_nvidia }}
      ci_image_cache_nvidia: ${{ fromJSON(needs.Precheck.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image_nvidia_cache }}
      platform: ${{ matrix.supported_platforms }}
      # Nightly passes the resolved clean version (e.g. 7.14.0) as ROCM_VERSION
      # and the build id separately; other versions pass the matrix value.
      rocm_version: ${{ matrix.rocm_versions == 'nightly' && needs.Precheck.outputs.nightly_rocm_version || matrix.rocm_versions }}
      rocm_nightly_build: ${{ matrix.rocm_versions == 'nightly' && needs.Precheck.outputs.nightly_build || '' }}

  # Due to GHA matrix limitations, we cannot inspect the result of individual jobs
  # in the matrix. To avoid confusing errors, our only option is that if a single
  # build fails, the entire workflow must stop. Which is rather unfortunate.
  Linux:
    if: >-
      ${{
        !cancelled() && (
          needs.build_CI_image.result == 'success' ||
          needs.build_CI_image.result == 'skipped'
        )
      }}
    needs: [Precheck, build_CI_image]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Precheck.outputs.ci_matrix) }}
    uses: ./.github/workflows/hipfile-ci.yml
    with:
      ci_image: ${{ fromJSON(needs.Precheck.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image }}
      ci_image_nvidia: ${{ fromJSON(needs.Precheck.outputs.ci_images)[format('{0}-{1}', matrix.supported_platforms, matrix.rocm_versions)].ci_image_nvidia }}
      platform: ${{ matrix.supported_platforms }}
      rocm_version: ${{ matrix.rocm_versions }}
